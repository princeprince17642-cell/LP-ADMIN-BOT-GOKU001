<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOKU AGENCY STORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        :root {
            --bg-color: #070913;
            --box-bg: #0b1120;
            --blue-glow: #3b82f6;
            --yellow-glow: #facc15;
            --white-text: #ffffff;
            --gray-text: #94a3b8;
            --border-color: #1e293b;
        }

        body { background: var(--bg-color); color: var(--white-text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- SPLASH / LOADING SCREEN --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .spinner-logo-container {
            position: relative;
            width: 130px; height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .spinner-logo {
            width: 110px; height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--blue-glow);
            box-shadow: 0 0 20px var(--blue-glow);
            animation: fadeIn 1s ease-in-out;
        }
        
        .glow-ring {
            position: absolute;
            width: 130px; height: 130px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top: 3px solid var(--blue-glow);
            animation: spin 1s linear infinite;
        }
        
        .splash-title {
            margin-top: 25px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--yellow-glow), #ffffff, var(--blue-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(59,130,246,0.5);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- MAIN APP --- */
        #app { display: none; flex-direction: column; min-height: 100vh; padding-bottom: 80px; }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: var(--box-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid var(--blue-glow);
            object-fit: cover;
            box-shadow: 0 0 10px var(--blue-glow);
        }
        .brand-text {
            font-size: 16px;
            font-weight: 800;
        }
        .text-goku { color: var(--yellow-glow); }
        .text-agency { color: var(--white-text); }
        .text-store { color: var(--blue-glow); }

        .profile-btn {
            background: #1e293b;
            border: 1px solid #334155;
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* --- TABS --- */
        .tab-content { display: none; padding: 25px 20px; flex: 1; text-align: center; }
        .tab-content.active { display: block; }
        
        .content-card {
            background: var(--box-bg);
            border-radius: 14px;
            padding: 30px 20px;
            border: 1px solid var(--border-color);
        }

        h2 { font-size: 20px; margin-bottom: 8px; color: var(--white-text); }
        p { color: var(--gray-text); font-size: 14px; }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--box-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            background: none; border: none;
            color: var(--gray-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-item.active { color: var(--blue-glow); }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash">
        <div class="spinner-logo-container">
            <div class="glow-ring"></div>
            <!-- यहाँ डेटा यूआरआई (Base64) या सही डायरेक्ट इमेज यूआरएल लगेगा जिससे लोगो फटेगा नहीं -->
            <img src="https://i.ibb.co/6R3vZ8S/gdx-logo.png" class="spinner-logo" alt="Logo" onerror="this.src='https://i.imgur.com/7k123ab.png'">
        </div>
        <div class="splash-title">GOKU AGENCY STORE</div>
    </div>

    <!-- Main App -->
    <div id="app">
        <header>
            <div class="brand-box">
                <img src="https://i.ibb.co/6R3vZ8S/gdx-logo.png" class="brand-logo" alt="Logo" onerror="this.src='https://i.imgur.com/7k123ab.png'">
                <div class="brand-text">
                    <span class="text-goku">GOKU</span> <span class="text-agency">AGENCY</span> <span class="text-store">STORE</span>
                </div>
            </div>
            <div class="profile-btn" onclick="switchTab('account')">👤</div>
        </header>

        <div id="tab-home" class="tab-content active">
            <div class="content-card">
                <h2>Welcome Home</h2>
                <p>Upcoming features and modules will appear here shortly.</p>
            </div>
        </div>

        <div id="tab-landing" class="tab-content">
            <div class="content-card">
                <h2>Landing Pages</h2>
                <p>Manage your landing pages here.</p>
            </div>
        </div>

        <div id="tab-orders" class="tab-content">
            <div class="content-card">
                <h2>Orders</h2>
                <p>View your order history here.</p>
            </div>
        </div>

        <div id="tab-account" class="tab-content">
            <div class="content-card">
                <h2>Account</h2>
                <p>Manage your wallet and profile details here.</p>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home')" id="nav-home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </button>
            <button class="nav-item" onclick="switchTab('landing')" id="nav-landing">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Landing Page
            </button>
            <button class="nav-item" onclick="switchTab('orders')" id="nav-orders">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                Orders
            </button>
            <button class="nav-item" onclick="switchTab('account')" id="nav-account">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Account
            </button>
        </nav>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                }, 500);
            }, 2000);
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
