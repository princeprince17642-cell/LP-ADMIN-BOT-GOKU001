<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Digital Agency Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .client-item { background: #334155; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
        .client-item a { color: #38bdf8; word-break: break-all; text-decoration: none; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-tab { flex: 1; padding: 10px; background: #1e293b; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .nav-tab.active { background: #2563eb; }
        .section { display: none; }
        .section.active { display: block; }
        .copy-btn { background: #10b981; margin-top: 8px; padding: 8px; font-size: 12px; }
        .copy-btn:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Jack Digital Agency Dashboard</h1>
        
        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('create')">Create New Landing Page</button>
            <button class="nav-tab" onclick="switchTab('pages')">Your Pages</button>
        </div>

        <!-- Create New Landing Page Section -->
        <div id="createSection" class="section active">
            <div class="card">
                <h3>Create New Landing Page & Bot Tracking</h3>
                <form id="createForm">
                    <label>Client Name</label>
                    <input type="text" id="clientName" required placeholder="e.g. Cybox">
                    
                    <label>Custom Domain (Optional - e.g. clientdomain.com)</label>
                    <input type="text" id="customDomain" placeholder="Leave blank for default Railway domain">

                    <label>Telegram Bot Username</label>
                    <input type="text" id="botUsername" required placeholder="@Syvoxlandingpagebot">

                    <label>Telegram Bot API Token (For Auto Tracking)</label>
                    <input type="text" id="botApiToken" required placeholder="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ">
                    
                    <label>Meta Pixel ID</label>
                    <input type="text" id="pixelId" required placeholder="1115936117748992">
                    
                    <label>Meta Access Token (CAPI)</label>
                    <textarea id="accessToken" required placeholder="EABBqGSM..."></textarea>
                    
                    <label>Telegram Channel Invite Link</label>
                    <input type="text" id="channelLink" required placeholder="https://t.me/+...">
                    
                    <label>Channel Image URL</label>
                    <input type="text" id="imageUrl" placeholder="https://... (Optional)">
                    
                    <button type="submit">Create Landing Page & Connect Bot</button>
                </form>
                
                <div id="resultBox" style="display:none; margin-top: 15px;">
                    <label style="color: #4ade80;">Success! Landing Page Link:</label>
                    <input type="text" id="resultLink" readonly style="background: #0f172a; color: #38bdf8; font-weight: bold;">
                    <button type="button" class="copy-btn" onclick="copyGeneratedLink()">📋 Copy Link</button>
                </div>
            </div>
        </div>

        <!-- Your Pages / Manage Section -->
        <div id="pagesSection" class="section">
            <div class="card">
                <h3>Your Created Landing Pages</h3>
                <div id="clientsList">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            if(tab === 'create') {
                document.querySelectorAll('.nav-tab')[0].classList.add('active');
                document.getElementById('createSection').classList.add('active');
            } else {
                document.querySelectorAll('.nav-tab')[1].classList.add('active');
                document.getElementById('pagesSection').classList.add('active');
                loadClients();
            }
        }

        async function loadClients() {
            const res = await fetch('/api/clients');
            const clients = await res.json();
            const listDiv = document.getElementById('clientsList');
            if(clients.length === 0) {
                listDiv.innerHTML = '<p style="color: #94a3b8; font-size: 13px;">No landing pages created yet.</p>';
                return;
            }
            listDiv.innerHTML = clients.map(c => {
                const pageUrl = c.customDomain ? `https://${c.customDomain}/p/${c.id}` : `${window.location.origin}/p/${c.id}`;
                return `
                    <div class="client-item">
                        <strong>Client: ${c.clientName}</strong><br>
                        <span>Bot: ${c.botUsername}</span><br>
                        <a href="${pageUrl}" target="_blank">${pageUrl}</a><br>
                        <button class="copy-btn" onclick="navigator.clipboard.writeText('${pageUrl}'); alert('Link copied!');">📋 Copy Link</button>
                    </div>
                `;
            }).join('');
        }

        function copyGeneratedLink() {
            const linkInput = document.getElementById('resultLink');
            linkInput.select();
            navigator.clipboard.writeText(linkInput.value);
            alert("Link copied to clipboard!");
        }

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                clientName: document.getElementById('clientName').value,
                customDomain: document.getElementById('customDomain').value,
                botUsername: document.getElementById('botUsername').value,
                botApiToken: document.getElementById('botApiToken').value,
                pixelId: document.getElementById('pixelId').value,
                accessToken: document.getElementById('accessToken').value,
                channelLink: document.getElementById('channelLink').value,
                imageUrl: document.getElementById('imageUrl').value
            };

            const res = await fetch('/api/create-client', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if(result.success) {
                document.getElementById('resultLink').value = result.landingPageUrl;
                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('createForm').reset();
            } else {
                alert("Error creating landing page");
            }
        });
    </script>
</body>
</html>
