<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOKU AGENCY STORE</title>
<meta name="theme-color" content="#070913">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#070913; --card:#0b1120;
  --blue:#3b82f6; --yellow:#facc15; --text:#e8eefc; --muted:#7f8cab;
  --line:rgba(59,130,246,.22);
  --glow-b:0 0 22px rgba(59,130,246,.3); --glow-y:0 0 22px rgba(250,204,21,.25);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{background:radial-gradient(800px 420px at 50% -140px,rgba(59,130,246,.18),transparent 70%),radial-gradient(500px 300px at 100% 100%,rgba(250,204,21,.05),transparent 70%),var(--bg);background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;transition:opacity .8s ease,visibility .8s}
#splash.hide{opacity:0;visibility:hidden}
.ring{position:relative;width:140px;height:140px;border-radius:50%;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 50%,var(--blue) 100%);-webkit-mask:radial-gradient(circle,transparent 62px,#000 63px);mask:radial-gradient(circle,transparent 62px,#000 63px);animation:spin 1.3s linear infinite;filter:drop-shadow(0 0 10px var(--blue))}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.22),transparent 68%);animation:breathe 2.4s ease-in-out infinite}
.logo{width:112px;height:112px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:32px;color:var(--yellow);text-shadow:0 0 14px rgba(250,204,21,.6);box-shadow:inset 0 0 26px rgba(59,130,246,.25);position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.45}}
.splash-title{font-size:24px;font-weight:800;letter-spacing:.14em;text-align:center;color:#fff;text-shadow:0 0 8px var(--blue),0 0 26px rgba(59,130,246,.75)}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(7,9,19,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 8px 28px rgba(59,130,246,.08)}
.brand{display:flex;align-items:center;gap:10px}
.mini-logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--blue);box-shadow:var(--glow-b);display:grid;place-items:center;background:var(--card);color:var(--yellow);font-weight:800;font-size:14px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:.06em}
.b-y{color:var(--yellow);text-shadow:0 0 10px rgba(250,204,21,.55)}
.b-w{color:#fff}
.b-b{color:var(--blue);text-shadow:0 0 10px rgba(59,130,246,.7)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--glow-b);transition:transform .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Content */
main{padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.view{display:none;animation:in .35s ease}
.view.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--glow-b),inset 0 0 0 1px rgba(255,255,255,.02)}
.card.gold{border-color:rgba(250,204,21,.28);box-shadow:var(--glow-y)}
.card h2{font-size:20px;margin-bottom:6px}
.card p{font-size:14px;color:var(--muted)}

/* Account: branding + profile */
.acc-brand{text-align:center;padding:6px 0 18px}
.acc-brand-title{font-size:26px;font-weight:800;letter-spacing:.2em;color:#fff;text-shadow:0 0 8px var(--blue),0 0 26px rgba(59,130,246,.6)}
.acc-brand-sub{margin-top:6px;font-size:11px;letter-spacing:.28em;color:var(--muted);font-weight:600}

.profile-card{position:relative;display:flex;align-items:center;gap:16px;padding:20px;border-radius:22px;background:linear-gradient(160deg,rgba(59,130,246,.10),rgba(11,17,32,.96) 55%);border:1px solid rgba(250,204,21,.28);box-shadow:var(--glow-y),inset 0 0 0 1px rgba(255,255,255,.02)}
.avatar{position:relative;flex:0 0 auto;width:78px;height:78px;border-radius:50%;padding:3px;background:conic-gradient(from 160deg,var(--blue),var(--yellow),var(--blue));box-shadow:0 0 22px rgba(59,130,246,.45)}
.avatar-inner{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--card);display:grid;place-items:center}
.avatar-inner svg{width:62%;height:62%;stroke:var(--blue);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.avatar-inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.avatar-inner img.show{display:block}
.p-info{min-width:0;flex:1}
.p-name{font-size:19px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-user{margin-top:3px;font-size:14px;color:var(--blue);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-id{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(59,130,246,.08);font-size:12px;color:var(--muted)}
.p-id b{color:var(--text);font-weight:700;letter-spacing:.04em}
.badge-admin{position:absolute;top:14px;right:14px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.12em;color:#1a1400;background:var(--yellow);box-shadow:0 0 14px rgba(250,204,21,.5)}
.badge-admin[hidden]{display:none}

.skeleton .p-name,.skeleton .p-user,.skeleton .p-id{color:transparent;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.10),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:8px;border-color:transparent}
.skeleton .p-id b{color:transparent}
@keyframes shimmer{to{background-position:-200% 0}}

.acc-error{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.08);color:#fca5a5;font-size:13px;line-height:1.5}
.acc-error[hidden]{display:none}

/* Account: balance card + deposit button */
.balance-card{position:relative;margin-top:16px;padding:22px 20px;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,rgba(250,204,21,.10),rgba(11,17,32,.97) 60%);border:1px solid rgba(250,204,21,.30);box-shadow:var(--glow-y),inset 0 0 0 1px rgba(255,255,255,.02)}
.balance-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(250,204,21,.16),transparent 70%);pointer-events:none}
.bal-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
.bal-label svg{width:18px;height:18px;stroke:var(--yellow);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bal-amount{display:flex;align-items:baseline;gap:6px;margin-top:12px;font-weight:800;color:#fff;text-shadow:0 0 18px rgba(250,204,21,.25)}
.bal-cur{font-size:26px;color:var(--yellow)}
.bal-num{font-size:40px;letter-spacing:.01em;line-height:1.1;word-break:break-all}
.bal-note{margin-top:10px;font-size:12px;color:var(--muted)}
.skeleton-bal .bal-num{color:transparent;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.10),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:10px}

.deposit-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:16px;border-radius:16px;font-size:15px;font-weight:800;letter-spacing:.2em;color:#1a1400;background:linear-gradient(135deg,#fde047,#facc15 55%,#eab308);box-shadow:0 8px 26px rgba(250,204,21,.28),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s}
.deposit-btn svg{width:20px;height:20px;stroke:#1a1400;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.deposit-btn:active{transform:scale(.98);box-shadow:0 4px 16px rgba(250,204,21,.22)}

/* Floating bottom nav */
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:612px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:24px;background:rgba(11,17,32,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 26px rgba(59,130,246,.16)}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:18px;background:linear-gradient(to bottom,rgba(59,130,246,.28),rgba(59,130,246,.08));border:1px solid rgba(59,130,246,.45);box-shadow:0 0 20px rgba(59,130,246,.4);transition:transform .4s cubic-bezier(.4,.1,.2,1);pointer-events:none}
.pill::before{content:"";position:absolute;top:-1px;left:50%;width:46%;height:2px;transform:translateX(-50%);background:var(--blue);border-radius:2px;box-shadow:0 0 12px 2px var(--blue)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap;transition:color .3s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:filter .3s}
.tab.active{color:var(--yellow)}
.tab.active svg{filter:drop-shadow(0 0 6px var(--yellow))}

@media (max-width:360px){
  .bal-num{font-size:34px}
  .profile-card{padding:16px;gap:12px}
  .avatar{width:68px;height:68px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div id="splash">
  <div class="ring"><div class="logo">G</div></div>
  <div class="splash-title">GOKU AGENCY STORE</div>
</div>

<header>
  <div class="brand">
    <div class="mini-logo">G</div>
    <div class="brand-name"><span class="b-y">GOKU</span> <span class="b-w">AGENCY</span> <span class="b-b">STORE</span></div>
  </div>
  <button class="icon-btn" aria-label="Open account" data-go="account">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
  </button>
</header>

<main>
  <section class="view active" id="home"><div class="card gold"><h2>Home</h2><p>Your content goes here.</p></div></section>
  <section class="view" id="landing"><div class="card"><h2>Landing Page</h2><p>Your content goes here.</p></div></section>
  <section class="view" id="orders"><div class="card"><h2>Orders</h2><p>Your content goes here.</p></div></section>

  <section class="view" id="account">
    <div class="acc-brand">
      <div class="acc-brand-title">GDX STORE</div>
      <div class="acc-brand-sub">YOUR ACCOUNT</div>
    </div>

    <div class="profile-card skeleton" id="profileCard">
      <span class="badge-admin" id="adminBadge" hidden>ADMIN</span>
      <div class="avatar">
        <div class="avatar-inner">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <img id="pImg" alt="Profile picture" referrerpolicy="no-referrer">
        </div>
      </div>
      <div class="p-info">
        <div class="p-name" id="pName">Loading name</div>
        <div class="p-user" id="pUser">@loading</div>
        <div class="p-id">User ID <b id="pId">0000000000</b></div>
      </div>
    </div>

    <div class="balance-card skeleton-bal" id="balanceCard">
      <div class="bal-label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19"/><circle cx="17" cy="14.5" r="1.2"/></svg>
        TOTAL BALANCE
      </div>
      <div class="bal-amount">
        <span class="bal-cur">&#8377;</span>
        <span class="bal-num" id="balNum">0000.00</span>
      </div>
      <div class="bal-note">Available in your GDX STORE wallet (INR)</div>
    </div>

    <button class="deposit-btn" id="depositBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      DEPOSIT
    </button>

    <div class="acc-error" id="accError" hidden></div>
  </section>
</main>

<nav id="nav">
  <div class="pill" id="pill"></div>
  <button class="tab active" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button class="tab" data-nav data-go="landing"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg>Landing Page</button>
  <button class="tab" data-go="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders</button>
  <button class="tab" data-go="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Account</button>
</nav>

<script>
(function(){
  // Telegram Mini App setup
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Splash screen
  setTimeout(function(){
    var s=document.getElementById('splash');
    s.classList.add('hide');
    setTimeout(function(){s.remove()},900);
  },2000);

  // Navigation
  var ids=['home','landing','orders','account'];
  var views=document.querySelectorAll('.view'), tabs=document.querySelectorAll('.tab'), pill=document.getElementById('pill');
  function go(id){
    views.forEach(function(v){v.classList.toggle('active',v.id===id)});
    tabs.forEach(function(t){t.classList.toggle('active',t.dataset.go===id)});
    pill.style.transform='translateX('+(ids.indexOf(id)*100)+'%)';
    window.scrollTo({top:0,behavior:'smooth'});
  }
  document.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click',function(){go(el.dataset.go)});
  });

  // Reusable API helper: always sends Telegram initData so the backend can verify the user
  function api(path){
    return fetch(path, {
      headers: { 'X-Telegram-Init-Data': tg ? tg.initData : '' }
    }).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      });
    });
  }

  var accError = document.getElementById('accError');
  function showError(msg){
    accError.textContent = msg;
    accError.hidden = false;
  }

  // Account: profile
  var profileCard = document.getElementById('profileCard');

  function renderProfile(u){
    var fullName = [u.firstName, u.lastName].filter(Boolean).join(' ') || 'Telegram User';
    document.getElementById('pName').textContent = fullName;
    document.getElementById('pUser').textContent = u.username ? '@' + u.username : 'No username';
    document.getElementById('pId').textContent = String(u.id);
    document.getElementById('adminBadge').hidden = !u.isAdmin;

    var img = document.getElementById('pImg');
    if (u.photoUrl) {
      img.onload = function(){ img.classList.add('show'); };
      img.onerror = function(){ img.classList.remove('show'); };
      img.src = u.photoUrl;
    }
    profileCard.classList.remove('skeleton');
  }

  function loadProfile(){
    return api('/api/me').then(function(data){
      renderProfile(data.user);
    }).catch(function(){
      showError('Could not verify your Telegram account. Please close and reopen the app.');
    });
  }

  // Account: wallet balance (always fetched from the backend)
  var balanceCard = document.getElementById('balanceCard');

  function formatINR(n){
    return new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  }

  function loadWallet(){
    return api('/api/wallet').then(function(data){
      document.getElementById('balNum').textContent = formatINR(data.wallet.balance);
      balanceCard.classList.remove('skeleton-bal');
    }).catch(function(){
      document.getElementById('balNum').textContent = '--';
      balanceCard.classList.remove('skeleton-bal');
      showError('Could not load your balance right now. Please try again in a moment.');
    });
  }

  // Deposit button: UI placeholder only. Payment system comes in a later task.

  function loadAccount(){
    if (!tg || !tg.initData) {
      document.getElementById('balNum').textContent = '--';
      balanceCard.classList.remove('skeleton-bal');
      showError('Please open GDX STORE from inside Telegram to see your account.');
      return;
    }
    loadProfile();
    loadWallet();
  }

  loadAccount();
})();
</script>
</body>
</html>
