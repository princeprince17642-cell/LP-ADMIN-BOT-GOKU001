<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOKU AGENCY STORE</title>
<meta name="theme-color" content="#070913">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#070913; --card:#0b1120;
  --blue:#3b82f6; --yellow:#facc15; --text:#e8eefc; --muted:#7f8cab;
  --green:#22c55e; --red:#f87171; --amber:#f59e0b; --violet:#8b5cf6;
  --line:rgba(59,130,246,.22);
  --glow-b:0 0 22px rgba(59,130,246,.3); --glow-y:0 0 22px rgba(250,204,21,.25);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{background:radial-gradient(800px 420px at 50% -140px,rgba(59,130,246,.18),transparent 70%),radial-gradient(500px 300px at 100% 100%,rgba(139,92,246,.08),transparent 70%),var(--bg);background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;transition:opacity .8s ease,visibility .8s}
#splash.hide{opacity:0;visibility:hidden}
.ring{position:relative;width:140px;height:140px;border-radius:50%;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 50%,var(--blue) 100%);-webkit-mask:radial-gradient(circle,transparent 62px,#000 63px);mask:radial-gradient(circle,transparent 62px,#000 63px);animation:spin 1.3s linear infinite;filter:drop-shadow(0 0 10px var(--blue))}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.22),transparent 68%);animation:breathe 2.4s ease-in-out infinite}
.logo{width:112px;height:112px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:32px;color:var(--yellow);text-shadow:0 0 14px rgba(250,204,21,.6);box-shadow:inset 0 0 26px rgba(59,130,246,.25);position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.45}}
.splash-title{font-size:24px;font-weight:800;letter-spacing:.14em;text-align:center;color:#fff;text-shadow:0 0 8px var(--blue),0 0 26px rgba(59,130,246,.75)}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(7,9,19,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 8px 28px rgba(59,130,246,.08)}
.brand{display:flex;align-items:center;gap:10px}
.mini-logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--blue);box-shadow:var(--glow-b);display:grid;place-items:center;background:var(--card);color:var(--yellow);font-weight:800;font-size:14px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:.06em}
.b-y{color:var(--yellow);text-shadow:0 0 10px rgba(250,204,21,.55)}
.b-w{color:#fff}
.b-b{color:var(--blue);text-shadow:0 0 10px rgba(59,130,246,.7)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--glow-b);transition:transform .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Content */
main{padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.view{display:none;animation:in .35s ease}
.view.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--glow-b),inset 0 0 0 1px rgba(255,255,255,.02)}
.card.gold{border-color:rgba(250,204,21,.28);box-shadow:var(--glow-y)}
.card h2{font-size:20px;margin-bottom:6px}
.card p{font-size:14px;color:var(--muted)}

.acc-sub{animation:in .3s ease}
.acc-sub[hidden]{display:none}

/* Account: compact profile row (sits just below the header, on the left) */
.profile-row{display:flex;align-items:center;gap:12px;padding:0 2px 2px}
.avatar{position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:50%;padding:2.5px;background:conic-gradient(from 160deg,var(--blue),var(--violet),var(--yellow),var(--blue));box-shadow:0 0 18px rgba(99,102,241,.45)}
.avatar-inner{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--card);display:grid;place-items:center}
.avatar-inner svg{width:60%;height:60%;stroke:var(--blue);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.avatar-inner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.avatar-inner img.show{display:block}
.p-info{min-width:0;flex:1}
.p-name-row{display:flex;align-items:center;gap:8px;min-width:0}
.p-name{font-size:16px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.p-user{margin-top:1px;font-size:12px;color:var(--blue);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-id{display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:3px 10px;border-radius:999px;border:1px solid rgba(139,92,246,.4);background:rgba(139,92,246,.12);font-size:11px;color:var(--muted)}
.p-id svg{width:13px;height:13px;stroke:#a78bfa;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p-id b{color:#fff;font-weight:700;letter-spacing:.04em}
.acc-tag{flex:0 0 auto;align-self:flex-start;margin-top:4px;padding:4px 10px;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:.16em;color:#a5b4fc;border:1px solid rgba(139,92,246,.35);background:rgba(139,92,246,.10)}
.badge-admin{flex:0 0 auto;padding:1px 8px;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:.1em;color:#1a1400;background:var(--yellow);box-shadow:0 0 12px rgba(250,204,21,.45)}
.badge-admin[hidden]{display:none}

.skeleton .p-name,.skeleton .p-user,.skeleton .p-id{color:transparent;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.10),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:8px;border-color:transparent}
.skeleton .p-id b,.skeleton .p-id svg{color:transparent;stroke:transparent}
@keyframes shimmer{to{background-position:-200% 0}}

.acc-error{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.08);color:#fca5a5;font-size:13px;line-height:1.5}
.acc-error[hidden]{display:none}

/* Account: balance card (blue-violet) + deposit button */
.balance-card{position:relative;margin-top:14px;padding:20px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#2563eb 0%,#5b50f0 52%,#8b5cf6 100%);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 34px rgba(91,80,240,.38),inset 0 1px 0 rgba(255,255,255,.22)}
.balance-card::after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.bal-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.78)}
.bal-label svg{width:18px;height:18px;stroke:#fde047;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bal-amount{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-weight:800;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.bal-cur{font-size:26px;color:#fde047}
.bal-num{font-size:40px;letter-spacing:.01em;line-height:1.1;word-break:break-all}
.bal-note{margin-top:8px;font-size:12px;color:rgba(255,255,255,.72)}
.skeleton-bal .bal-num{color:transparent;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.28),rgba(255,255,255,.10));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:10px}

.deposit-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:16px;border-radius:16px;font-size:15px;font-weight:800;letter-spacing:.2em;color:#1a1400;background:linear-gradient(135deg,#fde047,#facc15 55%,#eab308);box-shadow:0 8px 26px rgba(250,204,21,.28),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s}
.deposit-btn svg{width:20px;height:20px;stroke:#1a1400;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.deposit-btn:active{transform:scale(.98);box-shadow:0 4px 16px rgba(250,204,21,.22)}

/* Account: tappable tiles */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat-tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 10px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(11,17,32,.97) 60%);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.02);transition:transform .15s,border-color .2s}
.stat-tile:active{transform:scale(.97)}
.tile-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.tile-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile-dep .tile-icon{background:linear-gradient(145deg,#6366f1,#8b5cf6);box-shadow:0 0 18px rgba(139,92,246,.45)}
.tile-txn .tile-icon{background:linear-gradient(145deg,#06b6d4,#3b82f6);box-shadow:0 0 18px rgba(6,182,212,.4)}
.tile-dep{border-color:rgba(139,92,246,.35)}
.tile-txn{border-color:rgba(6,182,212,.35)}
.tile-title{font-size:12px;font-weight:800;letter-spacing:.1em;color:#fff}
.tile-count{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--yellow)}
.skeleton-tile .tile-count{color:transparent;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.10),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:6px}

/* Sub pages: Deposit History + Transactions */
.sub-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sub-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:#fff;min-width:0}
.sub-title svg{width:22px;height:22px;stroke:#a78bfa;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.back-btn{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(11,17,32,.9);transition:transform .15s}
.back-btn:active{transform:scale(.96)}
.back-ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
.back-ico svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.back-txt{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.back-txt small{font-size:8px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.back-txt b{font-size:12px;color:#fff}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tab-pill{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);background:rgba(11,17,32,.9);transition:all .2s}
.tab-pill .n{min-width:20px;padding:1px 6px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.08);color:var(--text)}
.tab-pill.on-completed{color:#052e16;background:linear-gradient(135deg,#4ade80,#22c55e);border-color:transparent;box-shadow:0 6px 20px rgba(34,197,94,.35)}
.tab-pill.on-failed{color:#450a0a;background:linear-gradient(135deg,#fca5a5,#f87171);border-color:transparent;box-shadow:0 6px 20px rgba(248,113,113,.35)}
.tab-pill.on-pending{color:#451a03;background:linear-gradient(135deg,#fcd34d,#f59e0b);border-color:transparent;box-shadow:0 6px 20px rgba(245,158,11,.35)}
.tab-pill[class*="on-"] .n{background:rgba(0,0,0,.18);color:inherit}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(11,17,32,.97) 60%);border:1px solid var(--line)}
.row-ico{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.row-ico svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico-completed,.ico-credit{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.35)}
.ico-completed svg,.ico-credit svg{stroke:var(--green)}
.ico-failed,.ico-debit{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.35)}
.ico-failed svg,.ico-debit svg{stroke:var(--red)}
.ico-pending{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.35)}
.ico-pending svg{stroke:var(--amber)}
.row-main{min-width:0;flex:1}
.row-title{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-date{margin-top:2px;font-size:11px;color:var(--muted)}
.row-note{margin-top:3px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-side{flex:0 0 auto;text-align:right}
.row-amt{font-size:15px;font-weight:800}
.amt-credit,.amt-completed{color:var(--green)}
.amt-debit,.amt-failed{color:var(--red)}
.amt-pending{color:var(--amber)}
.chip{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:9px;font-weight:800;letter-spacing:.1em}
.chip-completed{color:var(--green);background:rgba(34,197,94,.14)}
.chip-failed{color:var(--red);background:rgba(248,113,113,.14)}
.chip-pending{color:var(--amber);background:rgba(245,158,11,.14)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:40px 20px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.03),rgba(11,17,32,.97) 60%)}
.empty svg{width:46px;height:46px;stroke:#475569;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.empty b{font-size:17px;color:#fff}
.empty span{font-size:13px;color:var(--muted)}

/* Floating bottom nav */
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:612px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:24px;background:rgba(11,17,32,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 26px rgba(59,130,246,.16)}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:18px;background:linear-gradient(to bottom,rgba(59,130,246,.28),rgba(59,130,246,.08));border:1px solid rgba(59,130,246,.45);box-shadow:0 0 20px rgba(59,130,246,.4);transition:transform .4s cubic-bezier(.4,.1,.2,1);pointer-events:none}
.pill::before{content:"";position:absolute;top:-1px;left:50%;width:46%;height:2px;transform:translateX(-50%);background:var(--blue);border-radius:2px;box-shadow:0 0 12px 2px var(--blue)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap;transition:color .3s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:filter .3s}
.tab.active{color:var(--yellow)}
.tab.active svg{filter:drop-shadow(0 0 6px var(--yellow))}

@media (max-width:360px){
  .bal-num{font-size:34px}
  .avatar{width:52px;height:52px}
  .p-name{font-size:15px}
  .acc-tag{display:none}
  .stat-tile{padding:16px 8px}
  .tab-pill{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div id="splash">
  <div class="ring"><div class="logo">G</div></div>
  <div class="splash-title">GOKU AGENCY STORE</div>
</div>

<header>
  <div class="brand">
    <div class="mini-logo">G</div>
    <div class="brand-name"><span class="b-y">GOKU</span> <span class="b-w">AGENCY</span> <span class="b-b">STORE</span></div>
  </div>
  <button class="icon-btn" aria-label="Open account" data-go="account">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
  </button>
</header>

<main>
  <section class="view active" id="home"><div class="card gold"><h2>Home</h2><p>Your content goes here.</p></div></section>
  <section class="view" id="landing"><div class="card"><h2>Landing Page</h2><p>Your content goes here.</p></div></section>
  <section class="view" id="orders"><div class="card"><h2>Orders</h2><p>Your content goes here.</p></div></section>

  <section class="view" id="account">

    <!-- Account main page -->
    <div class="acc-sub" id="accMain">
      <div class="profile-row skeleton" id="profileCard">
        <div class="avatar">
          <div class="avatar-inner">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <img id="pImg" alt="Profile picture" referrerpolicy="no-referrer">
          </div>
        </div>
        <div class="p-info">
          <div class="p-name-row">
            <div class="p-name" id="pName">Loading name</div>
            <span class="badge-admin" id="adminBadge" hidden>ADMIN</span>
          </div>
          <div class="p-user" id="pUser">@loading</div>
          <div class="p-id">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
            ID <b id="pId">0000000000</b>
          </div>
        </div>
        <div class="acc-tag">YOUR ACCOUNT</div>
      </div>

      <div class="balance-card skeleton-bal" id="balanceCard">
        <div class="bal-label">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19"/><circle cx="17" cy="14.5" r="1.2"/></svg>
          TOTAL BALANCE
        </div>
        <div class="bal-amount">
          <span class="bal-cur">&#8377;</span>
          <span class="bal-num" id="balNum">0000.00</span>
        </div>
        <div class="bal-note">Available in your GDX STORE wallet (INR)</div>
      </div>

      <button class="deposit-btn" id="depositBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        DEPOSIT
      </button>

      <div class="stat-grid">
        <button class="stat-tile tile-dep skeleton-tile" id="depTile" type="button">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          </div>
          <div class="tile-title">DEPOSIT HISTORY</div>
          <div class="tile-count" id="depCount">0 RECORDS</div>
        </button>
        <button class="stat-tile tile-txn skeleton-tile" id="txnTile" type="button">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          </div>
          <div class="tile-title">TRANSACTIONS</div>
          <div class="tile-count" id="txnCount">0 RECORDS</div>
        </button>
      </div>

      <div class="acc-error" id="accError" hidden></div>
    </div>

    <!-- Deposit History page -->
    <div class="acc-sub" id="accDeposits" hidden>
      <div class="sub-head">
        <div class="sub-title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          Deposit History
        </div>
        <button class="back-btn" type="button" data-back>
          <span class="back-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span>
          <span class="back-txt"><small>BACK TO</small><b>Account</b></span>
        </button>
      </div>
      <div class="tabs" id="depTabs">
        <button class="tab-pill" type="button" data-tab="completed">Complete <span class="n" id="nCompleted">0</span></button>
        <button class="tab-pill" type="button" data-tab="failed">Failed <span class="n" id="nFailed">0</span></button>
        <button class="tab-pill" type="button" data-tab="pending">Pending <span class="n" id="nPending">0</span></button>
      </div>
      <div class="list" id="depList"></div>
    </div>

    <!-- Transactions page -->
    <div class="acc-sub" id="accTxns" hidden>
      <div class="sub-head">
        <div class="sub-title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          Transaction History
        </div>
        <button class="back-btn" type="button" data-back>
          <span class="back-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span>
          <span class="back-txt"><small>BACK TO</small><b>Account</b></span>
        </button>
      </div>
      <div class="list" id="txnList"></div>
    </div>

  </section>
</main>

<nav id="nav">
  <div class="pill" id="pill"></div>
  <button class="tab active" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button class="tab" data-nav data-go="landing"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg>Landing Page</button>
  <button class="tab" data-go="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders</button>
  <button class="tab" data-go="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Account</button>
</nav>

<script>
(function(){
  // Telegram Mini App setup
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Splash screen
  setTimeout(function(){
    var s=document.getElementById('splash');
    s.classList.add('hide');
    setTimeout(function(){s.remove()},900);
  },2000);

  // ---------- Account sub pages ----------
  var subPages = { main: 'accMain', deposits: 'accDeposits', txns: 'accTxns' };

  function showAcc(name){
    Object.keys(subPages).forEach(function(key){
      document.getElementById(subPages[key]).hidden = (key !== name);
    });
    if (tg && tg.BackButton) {
      if (name === 'main') tg.BackButton.hide(); else tg.BackButton.show();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  if (tg && tg.BackButton) {
    tg.BackButton.onClick(function(){ showAcc('main'); });
  }
  document.querySelectorAll('[data-back]').forEach(function(b){
    b.addEventListener('click', function(){ showAcc('main'); });
  });

  // Navigation
  var ids=['home','landing','orders','account'];
  var views=document.querySelectorAll('.view'), tabs=document.querySelectorAll('.tab'), pill=document.getElementById('pill');
  function go(id){
    views.forEach(function(v){v.classList.toggle('active',v.id===id)});
    tabs.forEach(function(t){t.classList.toggle('active',t.dataset.go===id)});
    pill.style.transform='translateX('+(ids.indexOf(id)*100)+'%)';
    showAcc('main');
  }
  document.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click',function(){go(el.dataset.go)});
  });

  // Reusable API helper: always sends Telegram initData so the backend can verify the user
  function api(path){
    return fetch(path, {
      headers: { 'X-Telegram-Init-Data': tg ? tg.initData : '' }
    }).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      });
    });
  }

  // Small safe DOM helper (never inserts untrusted text as HTML)
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function svgIcon(pathD){
    var ns = 'http://www.w3.org/2000/svg';
    var s = document.createElementNS(ns, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    pathD.forEach(function(d){
      var p = document.createElementNS(ns, 'path');
      p.setAttribute('d', d);
      s.appendChild(p);
    });
    return s;
  }

  var ICON = {
    completed: ['M5 12l5 5 9-10'],
    failed:    ['M6 6l12 12', 'M18 6L6 18'],
    pending:   ['M12 7v5l3 2', 'M12 3a9 9 0 100 18 9 9 0 000-18z'],
    credit:    ['M12 5v14', 'M6 13l6 6 6-6'],
    debit:     ['M12 19V5', 'M6 11l6-6 6 6']
  };

  function formatINR(n){
    return new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  }

  function formatDate(iso){
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function recordsText(n){
    return n + (n === 1 ? ' RECORD' : ' RECORDS');
  }

  function emptyBox(title, sub){
    var box = el('div', 'empty');
    box.appendChild(svgIcon(['M6 3h12v18l-3-2-3 2-3-2-3 2z', 'M9 8h6M9 12h6']));
    box.appendChild(el('b', '', title));
    box.appendChild(el('span', '', sub));
    return box;
  }

  var accError = document.getElementById('accError');
  function showError(msg){
    accError.textContent = msg;
    accError.hidden = false;
  }

  // ---------- Account: profile ----------
  var profileCard = document.getElementById('profileCard');

  function renderProfile(u){
    var fullName = [u.firstName, u.lastName].filter(Boolean).join(' ') || 'Telegram User';
    document.getElementById('pName').textContent = fullName;
    document.getElementById('pUser').textContent = u.username ? '@' + u.username : 'No username';
    document.getElementById('pId').textContent = String(u.id);
    document.getElementById('adminBadge').hidden = !u.isAdmin;

    var img = document.getElementById('pImg');
    if (u.photoUrl) {
      img.onload = function(){ img.classList.add('show'); };
      img.onerror = function(){ img.classList.remove('show'); };
      img.src = u.photoUrl;
    }
    profileCard.classList.remove('skeleton');
  }

  function loadProfile(){
    return api('/api/me').then(function(data){
      renderProfile(data.user);
    }).catch(function(){
      showError('Could not verify your Telegram account. Please close and reopen the app.');
    });
  }

  // ---------- Account: wallet (balance + record counts) ----------
  var balanceCard = document.getElementById('balanceCard');
  var depTile = document.getElementById('depTile');
  var txnTile = document.getElementById('txnTile');

  function loadWallet(){
    return api('/api/wallet').then(function(data){
      var w = data.wallet;
      document.getElementById('balNum').textContent = formatINR(w.balance);
      document.getElementById('depCount').textContent = recordsText(w.depositCount);
      document.getElementById('txnCount').textContent = recordsText(w.transactionCount);
    }).catch(function(){
      document.getElementById('balNum').textContent = '--';
      document.getElementById('depCount').textContent = '--';
      document.getElementById('txnCount').textContent = '--';
      showError('Could not load your wallet right now. Please try again in a moment.');
    }).then(function(){
      balanceCard.classList.remove('skeleton-bal');
      depTile.classList.remove('skeleton-tile');
      txnTile.classList.remove('skeleton-tile');
    });
  }

  // Deposit button: UI placeholder only. Payment system comes in a later task.

  // ---------- Deposit History page ----------
  var depState = { list: [], counts: { completed: 0, failed: 0, pending: 0 }, tab: 'completed' };
  var depList = document.getElementById('depList');
  var TAB_LABEL = { completed: 'complete', failed: 'failed', pending: 'pending' };

  function renderDeposits(){
    document.getElementById('nCompleted').textContent = depState.counts.completed;
    document.getElementById('nFailed').textContent = depState.counts.failed;
    document.getElementById('nPending').textContent = depState.counts.pending;

    document.querySelectorAll('#depTabs .tab-pill').forEach(function(b){
      b.className = 'tab-pill' + (b.dataset.tab === depState.tab ? ' on-' + b.dataset.tab : '');
    });

    depList.textContent = '';
    var items = depState.list.filter(function(d){ return d.status === depState.tab; });
    if (!items.length) {
      depList.appendChild(emptyBox('No ' + TAB_LABEL[depState.tab] + ' deposits', 'Nothing to show here yet.'));
      return;
    }
    items.forEach(function(d){
      var row = el('div', 'row');
      var ico = el('div', 'row-ico ico-' + d.status);
      ico.appendChild(svgIcon(ICON[d.status] || ICON.pending));
      row.appendChild(ico);

      var main = el('div', 'row-main');
      main.appendChild(el('div', 'row-title', 'Deposit'));
      main.appendChild(el('div', 'row-date', formatDate(d.createdAt)));
      if (d.reference) main.appendChild(el('div', 'row-note', d.reference));
      row.appendChild(main);

      var side = el('div', 'row-side');
      side.appendChild(el('div', 'row-amt amt-' + d.status, '\u20B9' + formatINR(d.amount)));
      side.appendChild(el('span', 'chip chip-' + d.status, d.status.toUpperCase()));
      row.appendChild(side);

      depList.appendChild(row);
    });
  }

  document.querySelectorAll('#depTabs .tab-pill').forEach(function(b){
    b.addEventListener('click', function(){
      depState.tab = b.dataset.tab;
      renderDeposits();
    });
  });

  function openDeposits(){
    showAcc('deposits');
    depList.textContent = '';
    depList.appendChild(emptyBox('Loading', 'Please wait...'));
    api('/api/deposits').then(function(data){
      depState.list = data.deposits;
      depState.counts = data.counts;
      renderDeposits();
    }).catch(function(){
      depList.textContent = '';
      depList.appendChild(emptyBox('Could not load deposits', 'Please go back and try again.'));
    });
  }

  // ---------- Transactions page ----------
  var txnList = document.getElementById('txnList');
  var TYPE_LABEL = { deposit: 'Deposit', gift_code: 'Gift Code', purchase: 'Purchase', refund: 'Refund', bonus: 'Bonus' };

  function renderTransactions(items){
    txnList.textContent = '';
    if (!items.length) {
      var box = emptyBox('No transactions', 'Every coin added or deducted will be listed here.');
      txnList.appendChild(box);
      return;
    }
    items.forEach(function(t){
      var row = el('div', 'row');
      var ico = el('div', 'row-ico ico-' + t.direction);
      ico.appendChild(svgIcon(ICON[t.direction]));
      row.appendChild(ico);

      var main = el('div', 'row-main');
      main.appendChild(el('div', 'row-title', TYPE_LABEL[t.type] || t.type));
      main.appendChild(el('div', 'row-date', formatDate(t.createdAt)));
      if (t.note) main.appendChild(el('div', 'row-note', t.note));
      row.appendChild(main);

      var side = el('div', 'row-side');
      var sign = t.direction === 'credit' ? '+' : '-';
      side.appendChild(el('div', 'row-amt amt-' + t.direction, sign + '\u20B9' + formatINR(t.amount)));
      var st = ['completed', 'failed', 'pending'].indexOf(t.status) >= 0 ? t.status : 'completed';
      side.appendChild(el('span', 'chip chip-' + st, st.toUpperCase()));
      row.appendChild(side);

      txnList.appendChild(row);
    });
  }

  function openTransactions(){
    showAcc('txns');
    txnList.textContent = '';
    txnList.appendChild(emptyBox('Loading', 'Please wait...'));
    api('/api/transactions').then(function(data){
      renderTransactions(data.transactions);
    }).catch(function(){
      txnList.textContent = '';
      txnList.appendChild(emptyBox('Could not load transactions', 'Please go back and try again.'));
    });
  }

  depTile.addEventListener('click', openDeposits);
  txnTile.addEventListener('click', openTransactions);

  // ---------- Start ----------
  function loadAccount(){
    if (!tg || !tg.initData) {
      document.getElementById('balNum').textContent = '--';
      document.getElementById('depCount').textContent = '--';
      document.getElementById('txnCount').textContent = '--';
      balanceCard.classList.remove('skeleton-bal');
      depTile.classList.remove('skeleton-tile');
      txnTile.classList.remove('skeleton-tile');
      showError('Please open GDX STORE from inside Telegram to see your account.');
      return;
    }
    loadProfile();
    loadWallet();
  }

  loadAccount();
})();
</script>
</body>
</html>
